<aside class="as-sidebar" [class.as-sidebar--collapsed]="collapsed">

  <!-- ── Toggle button ───────────────────────────────────── -->
  <button type="button" class="as-toggle" (click)="toggle()" [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
      [class.as-toggle-icon--flipped]="collapsed">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <!-- ── Admin identity ──────────────────────────────────── -->
  <div class="as-identity">
    <div class="as-id-avatar">{{ adminInitial }}</div>
    <div class="as-id-meta" [class.as-id-meta--hidden]="collapsed">
      <p class="as-id-name">{{ adminName }}</p>
      <span class="as-id-chip">🛡️ Administrator</span>
    </div>
  </div>

  <div class="as-divider"></div>

  <!-- ── Nav ─────────────────────────────────────────────── -->
  <nav class="as-nav" aria-label="Admin navigation">

    <span class="as-section-label" [class.as-section-label--hidden]="collapsed">OVERVIEW</span>

    <a routerLink="/admin" routerLinkActive="as-nav-item--active"
      [routerLinkActiveOptions]="{exact: true}"
      class="as-nav-item" (click)="closeMobile()">
      <span class="as-nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
      </span>
      <span class="as-nav-label" [class.as-nav-label--hidden]="collapsed">Dashboard</span>
      <span class="as-tooltip">Dashboard</span>
    </a>

    <div class="as-divider"></div>
    <span class="as-section-label" [class.as-section-label--hidden]="collapsed">MANAGEMENT</span>

    <a routerLink="/admin/users-management" routerLinkActive="as-nav-item--active"
      class="as-nav-item" (click)="closeMobile()">
      <span class="as-nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </span>
      <span class="as-nav-label" [class.as-nav-label--hidden]="collapsed">Users</span>
      @if (pendingKycCount > 0) {
        <span class="as-nav-badge" [class.as-nav-badge--hidden]="collapsed">{{ pendingKycCount }}</span>
      }
      <span class="as-tooltip">Users</span>
    </a>

    <a routerLink="/admin/accounts-management" routerLinkActive="as-nav-item--active"
      class="as-nav-item" (click)="closeMobile()">
      <span class="as-nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
      </span>
      <span class="as-nav-label" [class.as-nav-label--hidden]="collapsed">Accounts</span>
      <span class="as-tooltip">Accounts</span>
    </a>

    <a routerLink="/admin/loan-decision" routerLinkActive="as-nav-item--active"
      class="as-nav-item" (click)="closeMobile()">
      <span class="as-nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </span>
      <span class="as-nav-label" [class.as-nav-label--hidden]="collapsed">Loan Decisions</span>
      @if (pendingLoanCount > 0) {
        <span class="as-nav-badge" [class.as-nav-badge--hidden]="collapsed">{{ pendingLoanCount }}</span>
      }
      <span class="as-tooltip">Loan Decisions</span>
    </a>

    <a routerLink="/admin/transactions-management" routerLinkActive="as-nav-item--active"
      class="as-nav-item" (click)="closeMobile()">
      <span class="as-nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
      </span>
      <span class="as-nav-label" [class.as-nav-label--hidden]="collapsed">Transactions</span>
      <span class="as-tooltip">Transactions</span>
    </a>

  </nav>

  <!-- ── Bottom: logout ──────────────────────────────────── -->
  <div class="as-bottom">
    <div class="as-divider"></div>
    <button type="button" class="as-nav-item as-logout" (click)="logout()">
      <span class="as-nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span class="as-nav-label" [class.as-nav-label--hidden]="collapsed">Logout</span>
      <span class="as-tooltip">Logout</span>
    </button>
  </div>

</aside>

<!-- Mobile overlay -->
<div class="as-overlay" [class.as-overlay--visible]="mobileOpen" (click)="closeMobile()"></div>
