<div
    class="quick-action-card"
    (click)="openModal()">

    <div class="card-top">

        <div class="icon">
            📊
        </div>

        <div class="arrow">
            →
        </div>

    </div>

    <div class="card-content">

        <h3>
            Download Statement
        </h3>

        <p>
            Download account statements in PDF or Excel format.
        </p>

    </div>

</div>

@if(showModal){

<div class="modal-overlay">

    <div class="statement-modal">

        <div class="modal-header">

            <div>

                <h2>
                    Download Statement
                </h2>

                <p>
                    Generate statements for your accounts.
                </p>

            </div>

            <button
                class="close-btn"
                (click)="closeModal()">

                ✕

            </button>

        </div>

        <div class="form-grid">

            <div class="field">

                <label>Account</label>

                <select [(ngModel)]="statement.account">

                    <option>Savings Account</option>

                    <option>Current Account</option>

                </select>

            </div>

            <div class="field">

                <label>Format</label>

                <select [(ngModel)]="statement.format">

                    <option>PDF</option>

                    <option>Excel</option>

                </select>

            </div>

            <div class="field">

                <label>From Date</label>

                <input
                    type="date"
                    [(ngModel)]="statement.fromDate">

            </div>

            <div class="field">

                <label>To Date</label>

                <input
                    type="date"
                    [(ngModel)]="statement.toDate">

            </div>

        </div>

        <div class="button-row">

            <button
                class="cancel-btn"
                (click)="closeModal()">

                Cancel

            </button>

            <button
                class="download-btn"
                (click)="downloadStatement()">

                Download

            </button>

        </div>

    </div>

</div>

}
