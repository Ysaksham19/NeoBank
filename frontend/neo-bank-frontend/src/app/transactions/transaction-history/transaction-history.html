<div class="transaction-page">

    <div class="page-header">

        <h1>
            Transaction History
        </h1>

        <p>
            View and manage your transactions.
        </p>

    </div>

    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            placeholder="Search transactions..."
            [(ngModel)]="searchText"
            (input)="onSearch()">

    </div>

    <!-- Filters -->

    <div class="filter-row">

        <button
            [class.active]="selectedFilter === 'ALL'"
            (click)="applyFilter('ALL')">

            All

        </button>

        <button
            [class.active]="selectedFilter === 'CREDIT'"
            (click)="applyFilter('CREDIT')">

            Credit

        </button>

        <button
            [class.active]="selectedFilter === 'DEBIT'"
            (click)="applyFilter('DEBIT')">

            Debit

        </button>

    </div>

    <!-- Transactions -->

    <div class="transaction-list">

        @for(transaction of filteredTransactions; track transaction.id){

        <div class="transaction-card">

            <div>

                <h3>

                    {{ transaction.description }}

                </h3>

                <p>

                    {{ transaction.transactionDate }}

                </p>

            </div>

            <div
                class="amount"
                [class.credit]="transaction.transactionType === 'CREDIT'"
                [class.debit]="transaction.transactionType === 'DEBIT'">

                ₹{{ transaction.amount }}

            </div>

        </div>

        }

    </div>

</div>
