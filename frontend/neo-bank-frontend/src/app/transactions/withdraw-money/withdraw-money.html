<div class="withdraw-page">
  <div class="page-header">
    <h1>Withdraw Money</h1>
    <p>Withdraw funds securely from your account.</p>
  </div>

  <div class="withdraw-card">
    <div class="field">
      <label>Select Account</label>
      <select [(ngModel)]="selectedAccountId">
        @for(account of accounts; track account.id) {
          <option [value]="account.id">{{ account.accountType }} — {{ account.accountNumber }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" [(ngModel)]="withdrawRequest.amount" placeholder="Enter amount" min="1">
    </div>

    <div class="field">
      <label>Remarks (optional)</label>
      <textarea [(ngModel)]="withdrawRequest.remarks" placeholder="Add a note"></textarea>
    </div>

    @if(errorMessage) { <div class="error-message">{{ errorMessage }}</div> }

    <button class="withdraw-btn" [disabled]="loading" (click)="withdrawMoney()">
      {{ loading ? 'Processing...' : 'Withdraw Money' }}
    </button>
  </div>
</div>
@if(showToast) { <div class="success-toast">✅ Withdrawal successful</div> }
