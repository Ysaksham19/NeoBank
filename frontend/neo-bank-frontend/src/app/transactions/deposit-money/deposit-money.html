<div class="deposit-page">
  <div class="page-header">
    <h1>Deposit Money</h1>
    <p>Add money to your account securely.</p>
  </div>

  <div class="deposit-card">
    <div class="field">
      <label>Select Account</label>
      <select [(ngModel)]="selectedAccountId">
        @for(account of accounts; track account.id) {
          <option [value]="account.id">{{ account.accountType }} — {{ account.accountNumber }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" [(ngModel)]="depositRequest.amount" placeholder="Enter amount" min="1">
    </div>

    <div class="field">
      <label>Remarks (optional)</label>
      <textarea [(ngModel)]="depositRequest.remarks" placeholder="Add a note"></textarea>
    </div>

    @if(errorMessage) { <div class="error-message">{{ errorMessage }}</div> }

    <button class="deposit-btn" [disabled]="loading" (click)="depositMoney()">
      {{ loading ? 'Processing...' : 'Deposit Money' }}
    </button>
  </div>
</div>
@if(showToast) { <div class="success-toast">✅ Deposit successful</div> }
