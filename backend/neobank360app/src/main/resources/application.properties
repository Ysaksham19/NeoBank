spring.application.name=neobank360app
server.port=8080

# =============================================
# DATABASE — set via environment variables
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/neobank_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA — validate only; Flyway manages DDL
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =============================================
# JWT — MUST override JWT_SECRET in production
# =============================================
app.jwt.secret=${JWT_SECRET:neobank360SecretKeyForJWTSigningMustBe256BitsLongAbcDefGhiJklMnoPqr}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# =============================================
# OTP — set OTP_DEV_MODE=false in production!
# =============================================
app.otp.dev-mode=${OTP_DEV_MODE:false}
app.fast2sms.api-key=${FAST2SMS_API_KEY:NOTSET}
app.fast2sms.url=https://www.fast2sms.com/dev/bulkV2

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =============================================
# MAIL — set via environment variables
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
