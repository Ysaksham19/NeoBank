# =============================================
# COMMON CONFIGURATION (shared across all profiles)
# Values without ${} are safe defaults.
# Values with ${} MUST be supplied via environment variables or .env file.
# DO NOT hardcode credentials here.
# =============================================
spring.application.name=neobank360app

# =============================================
# JACKSON
# =============================================
spring.jackson.serialization.write-dates-as-timestamps=false

# =============================================
# ACTIVE PROFILE  (override with -Dspring.profiles.active=prod)
# =============================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
