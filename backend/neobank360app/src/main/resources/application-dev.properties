# =============================================
# DEV PROFILE  — local development only
# Safe to commit. Uses localhost defaults.
# =============================================
server.port=8080

# ─── DATABASE ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/neobank_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── FLYWAY ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# DEV: use a long, fixed key so restarts don't invalidate existing tokens
app.jwt.secret=neobank360DevSecretKeyForJWTSigningMustBe256BitsLongAbcDefGhiJklMnoPqrXyzDev
# 30 minutes
app.jwt.expiration=1800000

# ─── OTP ──────────────────────────────────────────────────────────────────────
app.otp.dev-mode=true
app.fast2sms.api-key=NOTSET
app.fast2sms.url=https://www.fast2sms.com/dev/bulkV2

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200

# ─── MAIL ─────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev@example.com}
spring.mail.password=${MAIL_PASSWORD:devpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── ACTUATOR (dev — expose all for debugging) ────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── LOGGING ──────────────────────────────────────────────────────────────────
logging.level.com.neobank360app=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
